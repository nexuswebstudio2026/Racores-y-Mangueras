<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 270" width="100%" height="100%">
  <defs>
    <clipPath id="circleClip">
      <circle cx="120" cy="115" r="92" />
    </clipPath>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0b2559" flood-opacity="0.35"/>
    </filter>
    <path id="sloganCurve" d="M 28 200 A 108 108 0 0 0 212 200" fill="none" />
  </defs>

  <g filter="url(#softGlow)">
    <!-- Base Circle Upper-Left: Deep Royal Navy Blue -->
    <circle cx="120" cy="115" r="92" fill="#0b2559" />

    <!-- Bottom-Right Half: Golden Yellow -->
    <polygon points="0,235 235,0 260,0 260,260 0,260" clip-path="url(#circleClip)" fill="#f5cc00" />

    <!-- Crisp Diagonal Divider Accent -->
    <line x1="55" y1="180" x2="185" y2="50" stroke="#0b2559" stroke-width="2" clip-path="url(#circleClip)" />

    <!-- Letter R (Golden Yellow on Navy Blue) -->
    <text 
      x="80" 
      y="118" 
      font-family="'Montserrat', 'Arial Black', Impact, sans-serif" 
      font-size="64" 
      font-weight="900" 
      fill="#f5cc00" 
      text-anchor="middle" 
      dominant-baseline="central"
      letter-spacing="-1"
    >R</text>

    <!-- Letter M (Navy Blue on Golden Yellow) -->
    <text 
      x="158" 
      y="145" 
      font-family="'Montserrat', 'Arial Black', Impact, sans-serif" 
      font-size="60" 
      font-weight="900" 
      fill="#0b2559" 
      text-anchor="middle" 
      dominant-baseline="central"
      letter-spacing="-1"
    >M</text>

    <!-- Outer Circle Border -->
    <circle cx="120" cy="115" r="92" fill="none" stroke="#0b2559" stroke-width="4.5" />
  </g>

  <!-- Arched Slogan: CALIDAD Y SERVICIO -->
  <text 
    font-family="'Montserrat', 'Arial Black', sans-serif" 
    font-size="17" 
    font-weight="900" 
    fill="#0b2559" 
    letter-spacing="1.5"
  >
    <textPath href="#sloganCurve" startOffset="50%" text-anchor="middle">
      CALIDAD Y SERVICIO
    </textPath>
  </text>
</svg>
